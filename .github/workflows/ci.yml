name: QA2 iOS diagnostic A-B (never merge)
on: [push]
permissions:
  contents: read
jobs:
  ios-diagnostic:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, instrumentation-off]
    env:
      RS_DIAG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
      - name: Single diagnostic observation (no retry)
        run: bash apps/ios/Scripts/test_ios_observe.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qa2-ios-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-observe-results/
