name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Offline release gate
        run: python scripts/release_check.py --output-dir "${{ runner.temp }}/runspecimen-release"
      - uses: actions/upload-artifact@v4
        with:
          name: runspecimen-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/runspecimen-release/
          if-no-files-found: error

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller (MAS freeze path)
        run: python -m pip install --upgrade pip 'pyinstaller>=6'
      - name: macOS companion smoke (swift test + build + MAS freeze, no GUI)
        run: bash apps/macos/Scripts/smoke_macos.sh
