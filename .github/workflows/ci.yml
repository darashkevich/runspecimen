name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap (Linux bwrap integration tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Offline release gate
        run: python scripts/release_check.py --output-dir "${{ runner.temp }}/runspecimen-release"
      - uses: actions/upload-artifact@v5
        with:
          name: runspecimen-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/runspecimen-release/
          if-no-files-found: error

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyInstaller (MAS freeze path)
        run: python -m pip install --upgrade pip 'pyinstaller>=6'
      - name: macOS companion smoke (swift test + build + MAS freeze, no GUI)
        run: |
          export RS_FREEZE_PYTHON="$(command -v python)"
          echo "RS_FREEZE_PYTHON=$RS_FREEZE_PYTHON"
          bash apps/macos/Scripts/smoke_macos.sh

  # Shipping Observe Release must not contain RUNSPECIMEN_TEST_HOOKS symbols.
  # Simulator Release is enough; not a device archive or App Store sign-off.
  ios-release-symbols:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify iOS Observe Release omits test-hook symbols
        run: |
          if ! command -v xcodebuild >/dev/null 2>&1; then
            echo "xcodebuild missing — skip (unexpected on macos-latest)"
            exit 1
          fi
          xcodebuild -version
          bash apps/ios/Scripts/verify_ios_release_symbols.sh
