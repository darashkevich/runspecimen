name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # HUMAN-ACCEPTANCE zsh sheet tests run on every release-check job.
      # Linux installs zsh here (a skip for missing zsh is not a pass).
      # macOS jobs (including macos-latest / Python 3.11) already have zsh.
      - name: Install bubblewrap and zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap zsh
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: iOS Release symbol gate fixtures
        run: sh apps/ios/Scripts/verify_ios_release_symbols.sh
      - name: Mac release identity and export defaults
        run: python -m unittest tests.test_macos_release_identity tests.test_store_export_defaults tests.test_store_privacy_surface
      - name: Offline release gate
        run: python scripts/release_check.py --output-dir "${{ runner.temp }}/runspecimen-release"
      - uses: actions/upload-artifact@v5
        with:
          name: runspecimen-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/runspecimen-release/
          if-no-files-found: error

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyInstaller (MAS freeze path)
        run: python -m pip install --upgrade pip 'pyinstaller>=6'
      - name: macOS companion smoke (swift test + build + MAS freeze, no GUI)
        run: |
          export RS_FREEZE_PYTHON="$(command -v python)"
          echo "RS_FREEZE_PYTHON=$RS_FREEZE_PYTHON"
          bash apps/macos/Scripts/smoke_macos.sh

  holder-swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Isolated holder Swift tests (no live daemon)
        run: bash apps/holder/Scripts/test_holder_isolated.sh

  ed25519:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the local package with the ed25519 extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[ed25519]'
      - name: Run Ed25519 tests with PyNaCl present
        run: |
          unset PYTHONPATH
          python -m unittest tests.test_ed25519 -v

  ios-observe-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run iOS Observe tests
        run: bash apps/ios/Scripts/test_ios_observe.sh
      - name: Preserve iOS test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-observe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-observe-results/TestResults.xcresult
            ${{ runner.temp }}/ios-observe-results/test.log
            ${{ runner.temp }}/ios-observe-results/environment.txt
            ${{ runner.temp }}/ios-observe-results/failure-diagnostics
          if-no-files-found: warn
          retention-days: 7
