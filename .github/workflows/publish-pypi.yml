name: Publish Python package to PyPI

# One validated GitHub Release build feeds PyPI as identical bytes.
# This workflow MUST NOT rebuild wheel/sdist. It downloads the published
# release assets, checks tag + SHA-256 against SHA256SUMS, and uploads those
# files. The next published candidate is checksum-only: `gh attestation verify`
# is expected to 404 until a future CI-built release attaches SLSA provenance
# to the same subjects. Do not publish draft tag v0.2.0-rc.11 (ecc1709).

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch-and-validate:
    name: Fetch GitHub Release assets and validate digests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = "v" + re.sub(r"(a|b|rc)(\d+)$", r"-\1.\2", version)
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match package version {version!r}; "
                  f"expected {expected_tag!r}"
              )
          tags = subprocess.check_output(
              ["git", "tag", "--points-at", "HEAD"], text=True
          ).splitlines()
          if release_tag not in tags:
              raise SystemExit(f"checked-out commit is not tagged {release_tag!r}")
          PY

      - name: Download the published GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir release-assets
          ls -la release-assets

      - name: Verify tag, filenames, and SHA-256 digests
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/verify_release_assets.py \
            --dir release-assets \
            --repo . \
            --tag "$RELEASE_TAG" \
            --require-pypi

      - name: Stage identical PyPI bytes (no rebuild)
        run: |
          mkdir pypi-dist
          cp release-assets/runspecimen-*.whl pypi-dist/
          cp release-assets/runspecimen-*.tar.gz pypi-dist/
          python - <<'PY'
          from pathlib import Path

          files = sorted(path.name for path in Path("pypi-dist").iterdir())
          if len(files) != 2 or not any(name.endswith(".whl") for name in files) or not any(
              name.endswith(".tar.gz") for name in files
          ):
              raise SystemExit(f"expected exactly one wheel and one source distribution, got {files}")
          print("PyPI distributions (bytes copied from GitHub Release):", *files, sep="\n- ")
          PY

      - name: Upload validated distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: pypi-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with OIDC
    needs: fetch-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/runspecimen
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: pypi-dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-dist/
