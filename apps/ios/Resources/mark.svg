<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <title>RunSpecimen mark</title>
  <!-- Specimen capsule -->
  <rect x="10" y="8.5" width="12" height="19" rx="6"
        fill="#0d1219" stroke="#9be56a" stroke-width="1.75"/>
  <!-- Exclusive-lease shackle -->
  <path d="M13.25 14.25V7.1c0-3.15 5.5-3.15 5.5 0v7.15"
        stroke="#6ec8ff" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Latch / tamper band -->
  <rect x="11.85" y="12.15" width="8.3" height="4.1" rx="1.05"
        fill="#111821" stroke="#6ec8ff" stroke-width="1.35"/>
  <!-- Approved-run tick -->
  <path d="M13.35 20.7 15.2 22.65 19.15 17.7"
        stroke="#9be56a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
