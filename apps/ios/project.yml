name: RunSpecimenObserve
options:
  bundleIdPrefix: com.darashkevich.runspecimen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: RunSpecimen Observe
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: RunSpecimen Observe pairs only with a Mac you enable on your local network or Tailscale. Non-loopback requires TLS. It cannot approve or execute runs.
    INFOPLIST_KEY_NSFaceIDUsageDescription: RunSpecimen Observe uses Face ID to sign a carried approval request with a key that stays in this iPhone's Secure Enclave. It does not approve a Mac run by itself.
    INFOPLIST_KEY_NSBonjourServices: ""
    DEVELOPMENT_TEAM: "UN6KF8636A"
    CODE_SIGN_STYLE: Automatic
targets:
  RunSpecimenObserve:
    type: application
    platform: iOS
    sources:
      - path: Sources/RunSpecimenObserve
      - path: ../macos/Sources/RunSpecimenCore/RSBA2Package.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darashkevich.runspecimen.observe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Shipping channel: TestFlight/later — no App Store submit in this change set.
        # Do not add RS_OBSERVE_DEV_SIGNER. That flag belongs only on RunSpecimenObserveDev.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          # The test host is this app, so the seam has to be compiled into the
          # Debug app the tests launch. Release does not define the flag.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG RUNSPECIMEN_TEST_HOOKS
  RunSpecimenObserveDev:
    type: application
    platform: iOS
    sources:
      - path: Sources/RunSpecimenObserve
      - path: Sources/ObserveDevSigner
      - path: ../macos/Sources/RunSpecimenCore/RSBA2Package.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darashkevich.runspecimen.observe.dev
        PRODUCT_NAME: RunSpecimenObserveDev
        INFOPLIST_KEY_CFBundleDisplayName: RunSpecimen Observe Dev
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RS_OBSERVE_DEV_SIGNER"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ObserveSchemaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ObserveSchemaTests
    dependencies:
      - target: RunSpecimenObserve
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.darashkevich.runspecimen.observe.schema-tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RUNSPECIMEN_TEST_HOOKS"
schemes:
  RunSpecimenObserve:
    build:
      targets:
        RunSpecimenObserve: all
    test:
      targets:
        - ObserveSchemaTests
  RunSpecimenObserveDev:
    build:
      targets:
        RunSpecimenObserveDev: all
