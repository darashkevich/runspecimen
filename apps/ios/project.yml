name: RunSpecimenObserve
options:
  bundleIdPrefix: com.darashkevich.runspecimen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: RunSpecimen Observe
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: RunSpecimen Observe pairs only with a Mac you enable on your local network or Tailscale. Non-loopback requires TLS. It cannot approve or execute runs.
    INFOPLIST_KEY_NSBonjourServices: ""
    DEVELOPMENT_TEAM: "UN6KF8636A"
    CODE_SIGN_STYLE: Automatic
targets:
  RunSpecimenObserve:
    type: application
    platform: iOS
    sources:
      - path: Sources/RunSpecimenObserve
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/mark.svg
      - path: Resources/apple-touch-icon.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darashkevich.runspecimen.observe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Shipping channel: TestFlight/later — no App Store submit in this change set.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  RunSpecimenObserve:
    build:
      targets:
        RunSpecimenObserve: all
    run:
      config: Debug
