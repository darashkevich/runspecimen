# XcodeGen project for Mac App Store Archive (Xcode 15+ / 27 validated).
#
# Generate / refresh:
#   brew install xcodegen   # optional if RunSpecimen.xcodeproj is already committed
#   cd apps/macos && ./Scripts/generate_xcodeproj.sh
#   open RunSpecimen.xcodeproj
#
# Pre-archive (required for Helpers embed):
#   ./Scripts/freeze_helper.sh --enable --require --verify
#   ./Scripts/archive_mas.sh
name: RunSpecimen
options:
  bundleIdPrefix: com.darashkevich
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ONLY_ACTIVE_ARCH: "NO"
targets:
  RunSpecimenCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/RunSpecimenCore
    settings:
      base:
        PRODUCT_NAME: RunSpecimenCore
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.darashkevich.runspecimen.core
  RunSpecimen:
    type: application
    platform: macOS
    sources:
      - path: Sources/RunSpecimenApp
    dependencies:
      - target: RunSpecimenCore
        embed: false
        link: true
    resources:
      - path: Resources
        excludes:
          - Info.plist
          - ICONS.md
    info:
      path: Config/Info-mas.plist
      properties:
        CFBundleDisplayName: RunSpecimen
        CFBundleExecutable: RunSpecimen
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleIdentifier: com.darashkevich.runspecimen
        CFBundleName: RunSpecimen
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1.3"
        CFBundleVersion: "4"
        RSDistributionChannel: mas
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: "Copyright © RunSpecimen Contributors. Apache-2.0."
    entitlements:
      path: Entitlements/RunSpecimen.mas.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.user-selected.executable: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darashkevich.runspecimen
        MARKETING_VERSION: "0.1.3"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_FILE: Config/Info-mas.plist
        PRODUCT_NAME: RunSpecimen
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Entitlements/RunSpecimen.mas.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
    scheme:
      testTargets: []
      archive:
        config: Release
    postCompileScripts:
      - name: Embed Frozen Helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          HELPER_SRC="${SRCROOT}/Helpers/payload/runspecimen"
          HELPER_NOTICE="${SRCROOT}/Helpers/payload/NOTICE.txt"
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          RES_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          REPO="$(cd "${SRCROOT}/../.." && pwd)"
          if [[ ! -x "$HELPER_SRC" ]]; then
            echo "error: Missing frozen helper at Helpers/payload/runspecimen."
            echo "error: Run: ./Scripts/freeze_helper.sh --enable --require --verify"
            exit 1
          fi
          if ! file "$HELPER_SRC" | grep -q 'Mach-O'; then
            echo "error: Helpers/payload/runspecimen must be a Mach-O freeze (MAS path)."
            file "$HELPER_SRC" || true
            exit 1
          fi
          # Fail-closed version gate BEFORE inherit entitlements (shell cannot exec after).
          REPO_VER=$(
            python3 -c 'import pathlib,re,sys; t=pathlib.Path(sys.argv[1],"src/runspecimen/__init__.py").read_text(); m=re.search(r"__version__\s*=\s*\"([^\"]+)\"", t); assert m; print(m.group(1))' \
              "$REPO"
          )
          HELPER_VER="$("$HELPER_SRC" --version 2>&1)" || {
            echo "error: Helpers/payload/runspecimen --version failed" >&2
            echo "$HELPER_VER" >&2
            exit 1
          }
          echo "Frozen helper pre-sign --version → $HELPER_VER (repo=$REPO_VER)"
          echo "$HELPER_VER" | grep -F "$REPO_VER" >/dev/null || {
            echo "error: helper version mismatch (want $REPO_VER, got $HELPER_VER)" >&2
            exit 1
          }
          mkdir -p "$DEST" "$RES_DEST"
          ENGINE_DEST="${RES_DEST}/RunSpecimenEngine"
          # Always stage icon + privacy manifest (XcodeGen resource sync can miss on some hosts).
          for f in AppIcon.icns AppIcon-1024.png PrivacyInfo.xcprivacy; do
            if [[ -f "${SRCROOT}/Resources/$f" ]]; then
              if cp -X /etc/hosts /tmp/.rs-cp-x-test 2>/dev/null; then
                rm -f /tmp/.rs-cp-x-test
                cp -X -f "${SRCROOT}/Resources/$f" "$RES_DEST/$f"
              else
                cp -f "${SRCROOT}/Resources/$f" "$RES_DEST/$f"
              fi
            fi
          done
          # Strip Finder/Box xattrs that break codesign ("resource fork … not allowed").
          INTERNAL_SRC="${SRCROOT}/Helpers/payload/_internal"
          if [[ ! -d "$INTERNAL_SRC" ]]; then
            echo "error: Missing Helpers/payload/_internal (onedir freeze required for MAS sandbox)." >&2
            echo "error: Run: ./Scripts/freeze_helper.sh --enable --require --verify" >&2
            exit 1
          fi
          rm -rf "$ENGINE_DEST" "$DEST/runspecimen" "$DEST/_internal" "$DEST/lib"
          mkdir -p "$ENGINE_DEST"
          if cp -X /etc/hosts /tmp/.rs-cp-x-test 2>/dev/null; then
            rm -f /tmp/.rs-cp-x-test
            cp -X -f "$HELPER_SRC" "$ENGINE_DEST/runspecimen"
            [[ -f "$HELPER_NOTICE" ]] && cp -X -f "$HELPER_NOTICE" "$RES_DEST/HelperNOTICE.txt" || true
          else
            cp -f "$HELPER_SRC" "$ENGINE_DEST/runspecimen"
            [[ -f "$HELPER_NOTICE" ]] && cp -f "$HELPER_NOTICE" "$RES_DEST/HelperNOTICE.txt" || true
          fi
          chmod +x "$ENGINE_DEST/runspecimen"
          mkdir -p "$ENGINE_DEST/_internal"
          if rsync -a --delete --exclude '__pycache__' --exclude '*.pyc' "$INTERNAL_SRC/" "$ENGINE_DEST/_internal/" 2>/dev/null; then
            :
          else
            cp -R "$INTERNAL_SRC/." "$ENGINE_DEST/_internal/"
          fi
          # Do not place loose files under Helpers — Xcode treats Contents/Helpers/*
          # as nested code that must be signed. Engine lives only under Resources.
          rm -rf "$DEST"
          mkdir -p "$DEST"
          xattr -cr "$ENGINE_DEST" 2>/dev/null || true
          "${SRCROOT}/Scripts/sign_nested_helper.sh" "$ENGINE_DEST/runspecimen"
          echo "Embedded helper engine: $ENGINE_DEST/runspecimen (engine $REPO_VER, onedir _internal)"
      - name: Clear Codesign Xattrs
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          if [[ -d "$APP" ]]; then
            xattr -cr "$APP" 2>/dev/null || true
            find "$APP" -exec xattr -c {} + 2>/dev/null || true
            find "$APP" \( -name '._*' -o -name '.DS_Store' \) -delete 2>/dev/null || true
            command -v dot_clean >/dev/null 2>&1 && dot_clean -m "$APP" 2>/dev/null || true
            HELPER="$APP/Contents/Resources/RunSpecimenEngine/runspecimen"
            if [[ -x "$HELPER" ]] && file "$HELPER" | grep -q 'Mach-O'; then
              # Re-seal nested helper with the SAME identity resolution + inherit entitlements.
              # Never hard-code codesign --sign - here (breaks Apple Distribution archives).
              "${SRCROOT}/Scripts/sign_nested_helper.sh" "$HELPER"
            fi
            echo "Cleared codesign xattrs on $APP"
          fi
