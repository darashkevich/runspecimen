[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runspecimen"
version = "0.2.0rc2"
description = "Bounded, approved, tamper-evident local research/engineering runs"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "RunSpecimen Contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["agents", "automation", "provenance", "safety", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
runspecimen = "runspecimen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runspecimen = ["py.typed"]
