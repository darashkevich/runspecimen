[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runspecimen"
version = "0.2.0rc13"
description = "Bounded, approved, tamper-evident local research/engineering runs"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "RunSpecimen Contributors" }]
license = {text = "Apache-2.0"}
dependencies = []
keywords = ["agents", "automation", "provenance", "safety", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# Optional only — default install stays dependency-free (stdlib).
# ``signing`` is an alias of ``ed25519``; keep both vetted in release_check.
ed25519 = ["pynacl>=1.5.0"]
signing = ["pynacl>=1.5.0"]

[project.scripts]
runspecimen = "runspecimen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runspecimen = ["py.typed"]
